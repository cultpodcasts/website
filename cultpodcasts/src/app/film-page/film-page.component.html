@if (isEpisode()) {
  @if (episode(); as ep) {
  <app-playable-detail-film [film]="ep" [emitCuratorEdit]="true" (curatorEdit)="editFilm($event)">
    <app-film-trailers [trailers]="ep.trailers" [filmId]="ep.id" [filmTitle]="ep.episodeTitle"></app-film-trailers>
  </app-playable-detail-film>
  } @else if (isLoading()) {
  <app-site-loading [active]="true" label="Loading episode" />
  @if (showEpisodeSkeleton()) {
  <app-episode-loading-skeleton />
  }
  } @else {
  <section class="browse-empty">
    <h2>Film not found.</h2>
    <div id="cta-button">
      <a mat-flat-button color="primary" [routerLink]="['/search', '*']" fragment="kind=Film">Search films</a>
    </div>
  </section>
  }
}
