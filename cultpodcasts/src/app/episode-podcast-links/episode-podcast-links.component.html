@for (row of serviceRows(); track row.key) {
@if (!row.placeholder) {
<a href="{{row.url}}" mat-icon-button target="_blank" rel="noopener noreferrer" [attr.aria-label]="row.displayName">
    @if (row.usesAppleMark) {
    <mat-icon><app-apple-podcasts-svg></app-apple-podcasts-svg></mat-icon>
    } @else {
    <mat-icon [svgIcon]="row.icon"></mat-icon>
    }
</a>
} @else {
<button mat-icon-button disabled="true" [attr.aria-label]="row.displayName">
    @if (row.usesAppleMark) {
    <mat-icon><app-apple-podcasts-svg class="not"></app-apple-podcasts-svg></mat-icon>
    } @else {
    <mat-icon [svgIcon]="row.icon" class="not"></mat-icon>
    }
</button>
}
}
