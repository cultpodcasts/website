@switch (episode().contentKind) {
  @case ("Film") {
    <app-curator-film-card
      [episode]="episode()"
      [showPromote]="showPromote()"
      [promoted]="promoted()"
      [titleAsLink]="titleAsLink()"
      [showDeleteEpisode]="showDeleteEpisode()"
      [authRoles]="authRoles()"
      [updating]="updating()"
      [loadingSubjectName]="loadingSubjectName()"
      [loadingGuestName]="loadingGuestName()"
      [loadingIgnored]="loadingIgnored()"
      [loadingRemoved]="loadingRemoved()"
      [loadingTweeted]="loadingTweeted()"
      [loadingBluesky]="loadingBluesky()"
      [statusActionLoading]="statusActionLoading()"
      (edit)="edit.emit($event)"
      (post)="post.emit($event)"
      (deleteEpisode)="deleteEpisode.emit({ episodeId: $event.episodeId, contentKind: episode().contentKind })"
      (promoteToggle)="promoteToggle.emit($event)"
      (removeSubject)="removeSubject.emit($event)"
      (removeGuest)="removeGuest.emit($event)"
      (addSuggestedGuest)="addSuggestedGuest.emit($event)"
      (toggleIgnored)="toggleIgnored.emit($event)"
      (toggleRemoved)="toggleRemoved.emit($event)"
      (toggleTweeted)="toggleTweeted.emit($event)"
      (toggleBluesky)="toggleBluesky.emit($event)" />
  }
  @case ("TvShowEpisode") {
    <app-curator-tv-show-episode-card
      [episode]="episode()"
      [showPromote]="showPromote()"
      [promoted]="promoted()"
      [titleAsLink]="titleAsLink()"
      [showDeleteEpisode]="showDeleteEpisode()"
      [authRoles]="authRoles()"
      [updating]="updating()"
      [loadingSubjectName]="loadingSubjectName()"
      [loadingGuestName]="loadingGuestName()"
      [loadingIgnored]="loadingIgnored()"
      [loadingRemoved]="loadingRemoved()"
      [loadingTweeted]="loadingTweeted()"
      [loadingBluesky]="loadingBluesky()"
      [statusActionLoading]="statusActionLoading()"
      (edit)="edit.emit($event)"
      (post)="post.emit($event)"
      (editParent)="editParent.emit($event)"
      (deleteEpisode)="deleteEpisode.emit({ episodeId: $event.episodeId, contentKind: episode().contentKind })"
      (promoteToggle)="promoteToggle.emit($event)"
      (removeSubject)="removeSubject.emit($event)"
      (removeGuest)="removeGuest.emit($event)"
      (addSuggestedGuest)="addSuggestedGuest.emit($event)"
      (toggleIgnored)="toggleIgnored.emit($event)"
      (toggleRemoved)="toggleRemoved.emit($event)"
      (toggleTweeted)="toggleTweeted.emit($event)"
      (toggleBluesky)="toggleBluesky.emit($event)" />
  }
  @case ("NewsReport") {
    <app-curator-news-report-card
      [episode]="episode()"
      [showPromote]="showPromote()"
      [promoted]="promoted()"
      [titleAsLink]="titleAsLink()"
      [showDeleteEpisode]="showDeleteEpisode()"
      [authRoles]="authRoles()"
      [updating]="updating()"
      [loadingSubjectName]="loadingSubjectName()"
      [loadingGuestName]="loadingGuestName()"
      [loadingIgnored]="loadingIgnored()"
      [loadingRemoved]="loadingRemoved()"
      [loadingTweeted]="loadingTweeted()"
      [loadingBluesky]="loadingBluesky()"
      [statusActionLoading]="statusActionLoading()"
      (edit)="edit.emit($event)"
      (post)="post.emit($event)"
      (editParent)="editParent.emit($event)"
      (deleteEpisode)="deleteEpisode.emit({ episodeId: $event.episodeId, contentKind: episode().contentKind })"
      (promoteToggle)="promoteToggle.emit($event)"
      (removeSubject)="removeSubject.emit($event)"
      (removeGuest)="removeGuest.emit($event)"
      (addSuggestedGuest)="addSuggestedGuest.emit($event)"
      (toggleIgnored)="toggleIgnored.emit($event)"
      (toggleRemoved)="toggleRemoved.emit($event)"
      (toggleTweeted)="toggleTweeted.emit($event)"
      (toggleBluesky)="toggleBluesky.emit($event)" />
  }
  @default {
    <app-curator-episode-card
      [episode]="episode()"
      [showPromote]="showPromote()"
      [promoted]="promoted()"
      [titleAsLink]="titleAsLink()"
      [showIndexPodcast]="showIndexPodcast()"
      [showDeleteEpisode]="showDeleteEpisode()"
      [authRoles]="authRoles()"
      [updating]="updating()"
      [loadingSubjectName]="loadingSubjectName()"
      [loadingGuestName]="loadingGuestName()"
      [loadingIgnored]="loadingIgnored()"
      [loadingRemoved]="loadingRemoved()"
      [loadingTweeted]="loadingTweeted()"
      [loadingBluesky]="loadingBluesky()"
      [statusActionLoading]="statusActionLoading()"
      (edit)="edit.emit($event)"
      (post)="post.emit($event)"
      (editPodcast)="editPodcast.emit($event)"
      (indexPodcast)="indexPodcast.emit($event)"
      (deleteEpisode)="deleteEpisode.emit({ podcastId: $event.podcastId, episodeId: $event.episodeId, contentKind: episode().contentKind })"
      (promoteToggle)="promoteToggle.emit($event)"
      (removeSubject)="removeSubject.emit($event)"
      (removeGuest)="removeGuest.emit($event)"
      (addSuggestedGuest)="addSuggestedGuest.emit($event)"
      (toggleIgnored)="toggleIgnored.emit($event)"
      (toggleRemoved)="toggleRemoved.emit($event)"
      (toggleTweeted)="toggleTweeted.emit($event)"
      (toggleBluesky)="toggleBluesky.emit($event)" />
  }
}
