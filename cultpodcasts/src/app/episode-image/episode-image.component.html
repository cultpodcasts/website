@if (this.imageUrl) {
<div class="container" [class.layout-tile]="layout === 'tile'" [class.layout-tile--wide]="layout === 'tile' && isWideArt" (click)="overlay($event, true)" [class.hasOverlay]="linksOverlay && !overlayVisible()"
    [class.overlayVisible]="overlayVisible()">
    <div class="overlay" [class.show]="overlayVisible()">
        <button class="close" mat-icon-button (click)="overlay($event, false)">
            <mat-icon>close</mat-icon>
        </button>
        <p>Episode can be found on:</p>
        <div class="linksWrapper">
            <div class="links">
                @for (link of serviceLinks; track link.key) {
                <div class="link">
                    <a href="{{link.url}}" mat-icon-button target="_blank" rel="noopener noreferrer" [attr.aria-label]="link.displayName">
                        @if (link.usesAppleMark) {
                        <mat-icon><app-apple-podcasts-svg></app-apple-podcasts-svg></mat-icon>
                        } @else {
                        <mat-icon [svgIcon]="link.icon"></mat-icon>
                        }
                    </a>
                    <label><a href="{{link.url}}" target="_blank" rel="noopener noreferrer">{{link.displayName}}</a></label>
                </div>
                }
            </div>
        </div>
    </div>
    @defer (on viewport) {
    <img src="{{this.imageUrl}}" [class.cropped]="isCropped">
    } @placeholder {
    <span class="placeholder"></span>
    }
</div>
}
