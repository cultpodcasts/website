<mat-form-field class="full-width">
    <mat-label>{{ labelText() }}</mat-label>
    <input type="text" matInput [formControl]="control()" [placeholder]="placeholder()" autocomplete="off"
        (paste)="onPaste($event)" (blur)="condense()">
    @if (link(); as href) {
    <a matIconButton matSuffix [href]="href" target="_blank" rel="noopener noreferrer"
        [attr.aria-label]="'Open on ' + site()" [title]="href">
        <mat-icon>open_in_new</mat-icon>
    </a>
    }
    @if (control().hasError(errorKey)) {
    <mat-error>{{ error() }}</mat-error>
    }
</mat-form-field>
