<h2 mat-dialog-title>{{ title() }}</h2>

<mat-dialog-content>
    @if (isSending()) {
    <mat-spinner style="margin:0 auto;" mode="indeterminate"></mat-spinner>
    } @else if (isInError()) {
    <p id="error">An error occurred</p>
    @if (error(); as err) {
        @if (err.message) {
            <p>{{err.message}}</p>
        }
    }
    } @else {
    Deleting a {{ noun() }} is permanent
    }
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-raised-button (click)="close()">Close</button>
    <button mat-raised-button [disabled]="isSending()" (click)="onSubmit()">Submit</button>
</mat-dialog-actions>
