@if (links().length > 0) {
<section class="film-trailers" aria-labelledby="film-trailers-heading">
  <h2 id="film-trailers-heading">Trailers</h2>
  <ul>
    @for (link of links(); track $index) {
    <li>
      <a [href]="link.url.href" target="_blank" rel="noopener noreferrer">{{ link.title }}</a>
      @if (link.duration) {
      <span class="duration">{{ link.duration }}</span>
      }
    </li>
    }
  </ul>
</section>
}
