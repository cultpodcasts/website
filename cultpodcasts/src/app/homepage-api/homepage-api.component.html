<section class="nflx" [class.nflx--ready]="!isLoading() && !isInError()"
  [class.nflx--playing]="!!playerService.episode() && playerService.mode() === 'dock'">
  <app-site-loading [active]="isLoading()" label="Loading homepage" />

  @if (isLoading()) {
  <div class="nflx-loading" aria-hidden="true">
    <div class="nflx-loading__billboard">
      <div class="nflx-loading__hero">
        <div class="nflx-loading__line nflx-loading__line--eyebrow"></div>
        <div class="nflx-loading__line nflx-loading__line--title"></div>
        <div class="nflx-loading__line nflx-loading__line--title nflx-loading__line--title-short"></div>
        <div class="nflx-loading__line nflx-loading__line--meta"></div>
        <div class="nflx-loading__line nflx-loading__line--desc"></div>
        <div class="nflx-loading__line nflx-loading__line--desc nflx-loading__line--desc-short"></div>
        <div class="nflx-loading__chips">
          <span class="nflx-loading__chip"></span>
          <span class="nflx-loading__chip"></span>
        </div>
        <div class="nflx-loading__actions">
          <span class="nflx-loading__btn nflx-loading__btn--primary"></span>
          <span class="nflx-loading__btn"></span>
        </div>
      </div>
    </div>

    <div class="nflx-loading__catalogue">
      <div class="nflx-loading__catalogue-inner">
        <div class="nflx-loading__stat">
          <div class="nflx-loading__line nflx-loading__line--stat"></div>
          <div class="nflx-loading__line nflx-loading__line--label"></div>
        </div>
        <div class="nflx-loading__stat nflx-loading__stat--hero">
          <div class="nflx-loading__line nflx-loading__line--stat-lg"></div>
          <div class="nflx-loading__line nflx-loading__line--label"></div>
        </div>
        <div class="nflx-loading__stat">
          <div class="nflx-loading__line nflx-loading__line--stat"></div>
          <div class="nflx-loading__line nflx-loading__line--label"></div>
        </div>
      </div>
    </div>

    <div class="nflx-loading__rail">
      <div class="nflx-loading__line nflx-loading__line--rail-title"></div>
      <div class="nflx-loading__posters">
        @for (_ of [1, 2, 3, 4, 5, 6]; track $index) {
        <div class="nflx-loading__poster">
          <div class="nflx-loading__poster-art"></div>
          <div class="nflx-loading__line nflx-loading__line--poster-title"></div>
          <div class="nflx-loading__line nflx-loading__line--poster-meta"></div>
        </div>
        }
      </div>
    </div>

    <div class="nflx-loading__rail">
      <div class="nflx-loading__line nflx-loading__line--rail-title"></div>
      <div class="nflx-loading__posters">
        @for (_ of [1, 2, 3, 4, 5]; track $index) {
        <div class="nflx-loading__poster">
          <div class="nflx-loading__poster-art"></div>
          <div class="nflx-loading__line nflx-loading__line--poster-title"></div>
          <div class="nflx-loading__line nflx-loading__line--poster-meta"></div>
        </div>
        }
      </div>
    </div>
  </div>
  } @else if (isInError()) {
  <div class="nflx-error page-rail">
    <p>An error occurred.</p>
    <button mat-flat-button color="primary" (click)="ngOnInit()">Try Again!</button>
  </div>
  } @else {
  <app-homepage-hero
    [slides]="heroSlides()"
    [curatedEpisodeIds]="curatedEpisodeIds()"
    [isCurator]="isCurator()"
    (manageHero)="openManageHero()"
    (manageRails)="openManageRails()"
    (removeFeatured)="removeFeaturedFromHero($event)"
    (play)="playEpisode($event)" />

  <app-homepage-catalogue
    [weekEpisodeCount]="weekEpisodeCount()"
    [episodeCount]="episodeCount()"
    [totalDurationDays]="totalDurationDays()"
    [episodeCountBaseline]="episodeCountBaseline" />

  <app-homepage-discover-rail [cults]="obscureCults()" />

  <div class="nflx-rows">
    @for (rail of rails(); track rail.id) {
    <app-episode-rail
      [title]="displayCatalogName(rail.title)"
      [episodes]="rail.episodes"
      [subject]="rail.subject"
      [titleLink]="rail.subject ? ['/subject', rail.subject] : undefined"
      [browseAllLink]="rail.subject ? ['/subject', rail.subject] : undefined"
      [deferPosters]="!rail.subject"
      [showPin]="isCurator() && !!rail.subject"
      [pinned]="isRailPinned(rail.subject)"
      [showPromote]="isCurator()"
      [promotedIds]="curatedIdSet()"
      [playingEpisodeId]="playingEpisodeId()"
      (play)="playEpisode($event)"
      (promoteToggle)="togglePromote($event)"
      (pinToggle)="toggleRailPin($event)" />
    }
  </div>
  }
</section>
