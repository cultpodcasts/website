<section class="nflx" [class.nflx--ready]="!isLoading() && !isInError()"
  [class.nflx--playing]="!!playerService.episode() && playerService.mode() === 'dock'">
  <app-site-loading [active]="isLoading()" label="Loading homepage" />

  <div class="nflx-search">
    <app-search-bar></app-search-bar>
  </div>

  @if (isLoading()) {
  <div class="nflx-loading" aria-hidden="true">
    <div class="nflx-loading__pulse"></div>
  </div>
  } @else if (isInError()) {
  <div class="nflx-error page-rail">
    <p>An error occurred.</p>
    <button mat-flat-button color="primary" (click)="ngOnInit()">Try Again!</button>
  </div>
  } @else {
  <app-homepage-hero
    [slides]="heroSlides()"
    [curatedEpisodeIds]="curatedEpisodeIds()"
    [isCurator]="isCurator()"
    [timeBucket]="heroTimeBucket()"
    (manageHero)="openManageHero()"
    (manageRails)="openManageRails()"
    (removeFeatured)="removeFeaturedFromHero($event)"
    (play)="playEpisode($event)" />

  <app-homepage-catalogue
    [weekEpisodeCount]="weekEpisodeCount()"
    [episodeCount]="episodeCount()"
    [totalDurationDays]="totalDurationDays()"
    [episodeCountBaseline]="episodeCountBaseline" />

  <app-homepage-discover-rail [cults]="obscureCults()" />

  <div class="nflx-rows">
    @for (rail of rails(); track rail.id) {
    <app-episode-rail
      [title]="displayCatalogName(rail.title)"
      [episodes]="rail.episodes"
      [subject]="rail.subject"
      [titleLink]="rail.subject ? ['/subject', rail.subject] : undefined"
      [browseAllLink]="rail.subject ? ['/subject', rail.subject] : undefined"
      [showPin]="isCurator() && !!rail.subject"
      [pinned]="isRailPinned(rail.subject)"
      [showPromote]="isCurator()"
      [promotedIds]="curatedIdSet()"
      [playingEpisodeId]="playingEpisodeId()"
      (play)="playEpisode($event)"
      (promoteToggle)="togglePromote($event)"
      (pinToggle)="toggleRailPin($event)" />
    }
  </div>
  }
</section>
