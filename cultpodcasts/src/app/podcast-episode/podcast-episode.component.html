<app-site-loading [active]="isLoading()" label="Loading episode" />

@if (isLoading()) {
<app-episode-loading-skeleton />
} @else if (episode) {
  <!-- One ng-content slot only — kind pages with projected rails (Film trailers) use their leaf directly. -->
  @switch (episode.contentKind) {
    @case (CataloguePlayableKind.Film) {
      <app-playable-detail-film
        [film]="episode"
        [emitCuratorEdit]="emitCuratorEdit"
        (curatorEdit)="curatorEdit.emit($event)" />
    }
    @case (CataloguePlayableKind.NewsReport) {
      <app-playable-detail-news
        [newsReport]="episode"
        [emitCuratorEdit]="emitCuratorEdit"
        (curatorEdit)="curatorEdit.emit($event)" />
    }
    @case (CataloguePlayableKind.TvShowEpisode) {
      <app-playable-detail-tv
        [tvShowEpisode]="episode"
        [emitCuratorEdit]="emitCuratorEdit"
        (curatorEdit)="curatorEdit.emit($event)" />
    }
    @default {
      <app-playable-detail-episode
        [episode]="episode"
        [emitCuratorEdit]="emitCuratorEdit"
        (curatorEdit)="curatorEdit.emit($event)" />
    }
  }
} @else {
<section class="browse-empty">
  <h2>Episode not found.</h2>
  <div id="cta-button">
    <button mat-flat-button color="primary" (click)="podcastPage()">Try the Podcast's page!</button>
  </div>
</section>
}
