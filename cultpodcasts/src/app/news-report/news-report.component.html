@if (isEpisode()) {
  @if (episode(); as ep) {
  <app-playable-detail-news [newsReport]="ep" [emitCuratorEdit]="true" (curatorEdit)="editReport($event)"></app-playable-detail-news>
  } @else if (isLoading()) {
  <app-site-loading [active]="true" label="Loading episode" />
  @if (showEpisodeSkeleton()) {
  <app-episode-loading-skeleton />
  }
  } @else {
  <section class="browse-empty">
    <h2>News report not found.</h2>
    @if (parentHub(); as hub) {
    <div id="cta-button">
      <a mat-flat-button color="primary" [routerLink]="hub">Try the page</a>
    </div>
    }
  </section>
  }
}
