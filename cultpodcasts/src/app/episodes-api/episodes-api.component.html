<section [attr.id]="embedded() ? null : 'results'" class="curator-page" [class.episodes-embedded]="embedded()">
    <div id="progresswrapper">
        @if (isLoading()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        }
    </div>

    <div class="curator-toolbar" [class.curator-toolbar--embedded]="embedded()" #curatorToolbar>
        <div class="curator-toolbar__title">
            <h2>{{ heading() }}</h2>
            @if (!isLoading() && !error() && episodes(); as list) {
            <span class="curator-toolbar__count">{{ list.length }} episode{{ list.length === 1 ? '' : 's' }}</span>
            }
        </div>
        @if (!isLoading() && !error()) {
        <div class="curator-toolbar__actions">
            <button mat-stroked-button type="button" [matMenuTriggerFor]="sort">
                <mat-icon>sort</mat-icon>
                Sort
            </button>
            <button mat-flat-button color="primary" type="button" (click)="refresh()">Refresh</button>
        </div>
        }
        <mat-menu #sort="matMenu">
            <button mat-menu-item id="dateasc" (click)="setSort(sortParamDateAsc)"
                [class.selected]="sortDirection()==sortParamDateAsc">
                <mat-icon>arrow_upward</mat-icon>
                <span>Date ascending</span>
            </button>
            <button mat-menu-item id="datedesc" (click)="setSort(sortParamDateDesc)"
                [class.selected]="sortDirection()==sortParamDateDesc">
                <mat-icon>arrow_downward</mat-icon>
                <span>Date descending</span>
            </button>
        </mat-menu>
    </div>

    @if (!isLoading() && error()) {
    <ng-container>
        <p id="error">An error occurred.</p>
        <div id="cta-button">
            <button mat-flat-button color="primary" (click)="refresh()">Try again</button>
        </div>
    </ng-container>
    }

    <div class="curator-card-grid">
    @for (result of episodes(); track result.id) {
    <app-curator-playable-card
        [episode]="result"
        [showPromote]="showHeroPromote(result)"
        [promoted]="curatedIdSet().has(result.id)"
        [titleAsLink]="true"
        [showIndexPodcast]="true"
        [showDeleteEpisode]="true"
        [authRoles]="authRoles()"
        [updating]="isUpdating(result.id)"
        [loadingSubjectName]="loadingSubjectName(result.id)"
        [loadingGuestName]="loadingGuestName(result.id)"
        [loadingIgnored]="isLoadingIgnored(result.id)"
        [loadingRemoved]="isLoadingRemoved(result.id)"
        [loadingTweeted]="isLoadingTweeted(result.id)"
        [loadingBluesky]="isLoadingBluesky(result.id)"
        [statusActionLoading]="isStatusActionLoading(result.id)"
        (edit)="editRow($event)"
        (post)="post($event)"
        (editPodcast)="editPodcast($event)"
        (indexPodcast)="index($event)"
        (deleteEpisode)="delete($event.podcastId, $event.episodeId)"
        (promoteToggle)="togglePromote($event)"
        (removeSubject)="removeSubject($event.episode, $event.subject)"
        (removeGuest)="removeGuest($event.episode, $event.guestName)"
        (addSuggestedGuest)="addSuggestedGuest($event.episode, $event.name)"
        (toggleIgnored)="toggleIgnored($event)"
        (toggleRemoved)="toggleRemoved($event)"
        (toggleTweeted)="toggleTweeted($event)"
        (toggleBluesky)="toggleBluesky($event)" />
    }
    </div>
</section>
