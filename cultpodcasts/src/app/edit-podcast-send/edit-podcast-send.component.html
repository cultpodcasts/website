<h2 mat-dialog-title>Updating Podcast</h2>

<mat-dialog-content>

    @if (isSending()) {
    <mat-spinner style="margin:0 auto;" mode="indeterminate"></mat-spinner>
    }
    @if (sendError()) {
    <div>
        <p id="error" role="alert">{{ errorMessage() }}</p>
    </div>
    }

</mat-dialog-content>

@if (sendError()) {
<mat-dialog-actions>
    @if (retryable()) {
    <button mat-raised-button type="button" (click)="retry()">Try again</button>
    }
    <button mat-raised-button type="button" (click)="close()">Close</button>
</mat-dialog-actions>
}
