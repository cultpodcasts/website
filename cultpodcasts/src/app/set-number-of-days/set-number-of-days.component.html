<h2 mat-dialog-title>Set Number Of Days</h2>

<mat-dialog-content>
    <mat-form-field class="full-width">
        <mat-label>Days</mat-label>
        <input matInput [(ngModel)]="days" type="number" min="1" max="14" (keydown.enter)="close(true)">
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions>
    <button mat-raised-button (click)="close(false)">Close</button>
    <button mat-raised-button (click)="close(true)">Ok</button>
</mat-dialog-actions>
