<h2 mat-dialog-title>Indexing {{ subject() }}</h2>

<mat-dialog-content>

    @if (isSending()) {
    <mat-spinner style="margin:0 auto;" mode="indeterminate"></mat-spinner>
    }
    @if (sendError()) {
    <div>
        <p>An error occured indexing {{ subject().toLowerCase() }}</p>
    </div>
    }

</mat-dialog-content>

@if (sendError()) {
<mat-dialog-actions>
    <button mat-raised-button (click)="close()">Close</button>
</mat-dialog-actions>
}
