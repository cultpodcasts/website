<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <p class="series-conflict__lede">
    Several {{ itemNounPlural }} share this name. Pick by platform ids or removed status — do not guess.
  </p>
  <ul class="series-conflict__list">
    @for (candidate of data.candidates; track candidate.id) {
    <li class="series-conflict__item">
      <button type="button" class="series-conflict__pick" (click)="pick(candidate)">
        <span class="series-conflict__title">{{ displayCatalogName(candidate.name ?? data.name) }}</span>
        <span class="series-conflict__meta">id: {{ candidate.id }}</span>
        <span class="series-conflict__meta">Spotify: {{ candidate.spotifyId || '—' }}</span>
        <span class="series-conflict__meta">Apple: {{ candidate.appleId ?? '—' }}</span>
        <span class="series-conflict__meta">YouTube channel: {{ candidate.youTubeChannelId || '—' }}</span>
        <span class="series-conflict__meta">YouTube playlist: {{ candidate.youTubePlaylistId || '—' }}</span>
        <span class="series-conflict__meta">Twitter: {{ candidate.twitterHandle || '—' }}</span>
        <span class="series-conflict__meta">Bluesky: {{ candidate.blueskyHandle || '—' }}</span>
        <span class="series-conflict__meta">Removed: {{ candidate.removed ? 'yes' : 'no' }}</span>
      </button>
    </li>
    }
  </ul>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-raised-button (click)="close()">Cancel</button>
</mat-dialog-actions>
