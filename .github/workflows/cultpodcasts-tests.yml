name: Cultpodcasts tests

on:
  pull_request:
    paths:
      - "cultpodcasts/**"
      - "scripts/**"
      - ".github/workflows/cultpodcasts-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cultpodcasts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: cultpodcasts/.nvmrc
          cache: npm
          cache-dependency-path: cultpodcasts/package-lock.json

      # @cultpodcasts/contracts is a private GitHub Packages package published from RedditPodcastPoster
      # (cultpodcasts/.npmrc). This repo's GITHUB_TOKEN cannot read it: NODE_AUTH_TOKEN is a PAT with read:packages.
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=npm ci::Repository secret NODE_AUTH_TOKEN (GitHub PAT with read:packages) is not set; it is needed to install @cultpodcasts/contracts from npm.pkg.github.com."
            exit 1
          fi
          npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit + e2e
        run: npm run test:all
